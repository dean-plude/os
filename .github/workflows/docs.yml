# Docs: after a push to main, report which generated regions of README.md,
# docs/ROADMAP.md, docs/HISTORY.md and docs/building.md are behind their
# fragment files (tools/docgen.py; CONTRIBUTING.md explains the layout).
# Read-only: main only takes pull requests, so the daily "Docs sync" pull
# request rebuilds them and the docs check accepts exact regenerations.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Report stale generated docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: List stale generated files
        run: |
          if python3 tools/docgen.py --check; then
            echo "generated docs are up to date"
          else
            echo "::notice::generated docs are behind main's fragments; the next daily Docs sync pull request rebuilds them"
          fi
