# Boot CI: every pull request builds NovaOS, boots it in QEMU and runs the
# self-tests (tools/selftest.py): the core suite, the network suite (IPv4,
# IPv6 and winhttp's HTTP/2 over virtio-net) and the graphics suite (Mesa
# and DXVK from the App Store, then tools/gltest and tools/d3dtest).
# A failing test fails its check; make both required status checks on main
# to block the merge.
#
# The boot-test job also builds the bootable ISO (scripts/create-iso.sh) and
# keeps it as the "nova-iso" run artifact, so every pull request has a
# downloadable nova.iso.  After a push to main passes, the publish-iso job
# puts that ISO on the rolling "latest" release:
#   https://github.com/dean-plude/os/releases/latest/download/nova.iso
# nova.iso is not committed to the repository.
#
# The checks job runs first, in seconds: no conflict markers left by a
# merge, the DLL and program manifests and the self-test files load, and
# (on a pull request) the generated doc regions were not edited by hand
# (CONTRIBUTING.md).  The boot tests wait for it.  The merge queue runs the
# same jobs on its temporary merge-group branches (the generated-docs check
# was already done on the pull request, so it is skipped there).
# (CONTRIBUTING.md).  The boot tests wait for it.
#
# Speed: the build compiles through ccache, whose cache the boot-test job
# saves after each build (main's cache is shared with every pull request), so
# only changed files recompile.  A pull request that changes only Markdown,
# docs/ or LICENSE skips the build and boot jobs: they report "skipped",
# which GitHub counts as passing for required checks.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

env:                            # ccache (the build's clang calls go through /usr/lib/ccache)
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: 'true'
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 500M

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (conflict markers, manifests, generated docs)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # a pull request's merge commit and its base (HEAD^1)

      - name: No merge conflict markers
        run: python3 tools/ci/check-conflict-markers.py

      - name: Does the change touch anything but docs?
        id: changes
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
             ! git diff --name-only HEAD^1 HEAD | grep -qvE '^docs/|\.md$|^LICENSE$'; then
            code=false
            echo "Docs-only change: the build and boot jobs are skipped."
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: DLL and program manifests load
        run: python3 tools/build_userland.py --check

      - name: Self-test and app-corpus files load
        run: |
          python3 tools/selftest.py --list
          python3 tools/selftest.py --suite graphics --list
          python3 tools/selftest.py --suite network --list
          python3 -c "import sys; sys.path.insert(0, 'tools'); import appcorpus; print(len(appcorpus.APPS), 'corpus programs')"

      - name: Generated doc regions untouched, fragments build
        if: github.event_name == 'pull_request' && github.head_ref != 'docs/regenerate'
        run: python3 tools/docgen.py --check-pr HEAD^1

  boot-test:
    name: Build and boot-test
    needs: checks
    if: needs.checks.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain and QEMU
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            cmake make nasm clang lld llvm libc++-dev gcc-mingw-w64-x86-64 \
            qemu-system-x86 qemu-system-gui ovmf mtools dosfstools acpica-tools xorriso \
            pulseaudio pulseaudio-utils ccache
          echo /usr/lib/ccache >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build the kernel, bootloader, userland and disk image
        run: |
          cmake -S . -B build -G "Unix Makefiles"
          make -C build -j"$(nproc)" || {
            cat build/kernel_build-prefix/src/kernel_build-stamp/kernel_build-build-err.log 2>/dev/null | tail -100
            exit 1
          }
          test -f build/nova.img
          ccache -s

      - name: Save the compiler cache
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build the bootable ISO
        run: scripts/create-iso.sh build/nova.iso build/bootx64.efi build/kernel.elf

      - name: Keep the ISO
        uses: actions/upload-artifact@v4
        with:
          name: nova-iso
          path: build/nova.iso
          if-no-files-found: error

      - name: Boot NovaOS and run the self-tests
        run: |
          python3 tools/selftest.py --img build/nova.img --out selftest-out \
            --junit selftest-out/junit.xml --summary "$GITHUB_STEP_SUMMARY"

      - name: Run the network self-tests (IPv4, IPv6, HTTP/2)
        if: success() || failure()
        run: |
          python3 tools/selftest.py --suite network --img build/nova.img --out selftest-out/network \
            --junit selftest-out/network/junit.xml --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the serial log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-out
          path: selftest-out
          if-no-files-found: ignore

  graphics-test:
    name: Graphics tests (OpenGL, Direct3D)
    needs: checks
    if: needs.checks.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain and QEMU
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            cmake make nasm clang lld llvm libc++-dev gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 \
            qemu-system-x86 ovmf mtools dosfstools acpica-tools p7zip-full curl ccache
          echo /usr/lib/ccache >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Cache the Mesa, DXVK and 7-Zip downloads
        uses: actions/cache@v4
        with:
          path: gfx-cache
          key: gfx-${{ hashFiles('kernel/apps/store.c', 'tools/ci/stage-graphics.sh') }}

      - name: Build NovaOS
        run: |
          cmake -S . -B build -G "Unix Makefiles"
          make -C build -j"$(nproc)" || {
            cat build/kernel_build-prefix/src/kernel_build-stamp/kernel_build-build-err.log 2>/dev/null | tail -100
            exit 1
          }
          ccache -s

      - name: Stage 7-Zip, the downloads and the test programs
        run: tools/ci/stage-graphics.sh gfx gfx-cache

      - name: Run d2dtest, install Mesa and DXVK from the App Store, run gltest and d3dtest
        run: |
          python3 tools/selftest.py --suite graphics --gfx gfx --img build/nova.img --out graphics-out \
            --junit graphics-out/junit.xml --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the serial log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics-out
          path: graphics-out
          if-no-files-found: ignore

  publish-iso:
    name: Publish nova.iso
    needs: [boot-test, graphics-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-iso
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nova-iso

      - name: Move the "latest" release to this commit and attach the ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum nova.iso > nova.iso.sha256
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          notes="NovaOS built from main at ${GITHUB_SHA::7} by CI run ${GITHUB_RUN_ID}.
          Boot it with UEFI firmware; see the README for the QEMU command line."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest nova.iso nova.iso.sha256 --clobber
            gh release edit latest --title "NovaOS (latest main)" --notes "$notes" --latest
          else
            gh release create latest nova.iso nova.iso.sha256 \
              --title "NovaOS (latest main)" --notes "$notes" --latest
          fi
