name: CI
'on':
  pull_request: {}
  merge_group: {}
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      allow_tcg:
        description: Allow slower software emulation when KVM is unavailable
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: Checks (conflict markers, manifests, generated docs)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.plan.outputs.code }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install host test dependencies
      run: |-
        sudo apt-get update -qq
        sudo apt-get install -y -qq python3-yaml
    - name: Plan required execution
      run: python3 tools/ci/plan.py
      id: plan
    - name: Validate workflows
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
    - name: Host regressions
      run: python3 -m unittest discover -s tests/tools -v
    - name: Validate manifests and suites
      run: |-
        python3 tools/ci/check-conflict-markers.py
        python3 tools/build_userland.py --check
        for suite in core network devices graphics; do python3 tools/selftest.py --suite "$suite" --list; done
        python3 tools/compat_smoke.py --list
        python3 tools/ci/plan.py --matrix
    - name: Validate generated documentation
      run: |-
        base=$(python3 -c 'import json,os; e=json.load(open(os.environ["GITHUB_EVENT_PATH"])); print(e.get("pull_request",{}).get("base",{}).get("sha") or e.get("merge_group",{}).get("base_sha") or "HEAD")')
        python3 tools/docgen.py --check-pr "$base"
  build:
    name: Build
    needs: checks
    if: needs.checks.outputs.code == 'true'
    uses: ./.github/workflows/build.yml
    with:
      release: ${{ inputs.release || false }}
  compatibility:
    name: Compatibility smoke
    needs:
    - checks
    - build
    if: needs.checks.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Install runtime dependencies
      run: tools/ci/install.sh runtime
    - name: Select accelerator
      run: tools/ci/enable-kvm.sh optional
      env:
        NOVARUN_ALLOW_TCG: ${{ inputs.allow_tcg || false }}
    - uses: actions/download-artifact@v4
      with:
        name: nova-image
        path: build
    - name: Verify tested image
      run: python3 tools/ci/image_manifest.py verify --sha "$GITHUB_SHA"
    - name: Run regressions
      run: python3 tools/compat_smoke.py --img build/nova.img --out compat-smoke-out --junit compat-smoke-out/junit.xml
        --summary "$GITHUB_STEP_SUMMARY"
    - name: Keep compat-smoke-out
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: compat-smoke-out
        path: compat-smoke-out
        if-no-files-found: ignore
        retention-days: 14
  boot-test:
    name: OS tests (${{ matrix.suite }})
    needs:
    - checks
    - build
    if: needs.checks.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Install runtime dependencies
      run: tools/ci/install.sh runtime
    - name: Select accelerator
      run: tools/ci/enable-kvm.sh optional
      env:
        NOVARUN_ALLOW_TCG: ${{ inputs.allow_tcg || false }}
    - uses: actions/download-artifact@v4
      with:
        name: nova-image
        path: build
    - name: Verify tested image
      run: python3 tools/ci/image_manifest.py verify --sha "$GITHUB_SHA"
    - name: Run regressions
      run: python3 tools/selftest.py --suite "$SUITE" --img build/nova.img --out "selftest-$SUITE" --junit "selftest-$SUITE/junit.xml"
        --summary "$GITHUB_STEP_SUMMARY"
    - name: Keep selftest-${{ matrix.suite }}
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: selftest-${{ matrix.suite }}
        path: selftest-${{ matrix.suite }}
        if-no-files-found: ignore
        retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        suite:
        - core
        - network
        - devices
    env:
      SUITE: ${{ matrix.suite }}
  graphics-test:
    name: Graphics tests (OpenGL, Direct3D)
    needs:
    - checks
    - build
    if: needs.checks.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Install graphics dependencies
      run: tools/ci/install.sh graphics
    - name: Select accelerator
      run: tools/ci/enable-kvm.sh optional
      env:
        NOVARUN_ALLOW_TCG: ${{ inputs.allow_tcg || false }}
    - uses: actions/download-artifact@v4
      with:
        name: nova-image
        path: build
    - name: Verify tested image
      run: python3 tools/ci/image_manifest.py verify --sha "$GITHUB_SHA"
    - name: Cache the Mesa, DXVK and 7-Zip downloads
      uses: actions/cache@v4
      with:
        path: gfx-cache
        key: gfx-${{ hashFiles('kernel/apps/store.c', 'tools/ci/stage-graphics.sh') }}
    - name: Cache Venus
      id: venus-cache
      uses: actions/cache@v4
      with:
        path: venus-out/venus.7z
        key: venus-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build_venus.py', 'third_party/mesa-venus/**')
          }}
    - name: Build Venus and virgl (Mesa's Vulkan and OpenGL drivers for the virtio-gpu)
      if: steps.venus-cache.outputs.cache-hit != 'true'
      run: python3 tools/build_venus.py venus-out --work "$RUNNER_TEMP/venus-work"
    - name: Keep Venus for the release
      uses: actions/upload-artifact@v4
      with:
        name: venus
        path: venus-out/venus.7z
        if-no-files-found: error
    - name: Cache the QEMU with Venus
      id: qemu-cache
      uses: actions/cache@v4
      with:
        path: ~/qv
        key: qemu-venus-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/build-qemu-venus.sh') }}
    - name: Build QEMU 10.2 and virglrenderer with Venus
      if: steps.qemu-cache.outputs.cache-hit != 'true'
      run: tools/ci/build-qemu-venus.sh ~/qv "$RUNNER_TEMP/qemu-src"
    - name: Stage 7-Zip, the downloads and the test programs
      run: VENUS_7Z=venus-out/venus.7z tools/ci/stage-graphics.sh gfx gfx-cache
    - name: Run d2dtest, install Mesa, DXVK and Venus from the App Store, run gltest, d3dtest and the frame-rate
        tests
      run: |
        export NOVARUN_QEMU="$HOME/qv/bin/qemu-system-x86_64" LD_LIBRARY_PATH="$HOME/qv/lib/x86_64-linux-gnu"
        # what the host side was doing when a test hangs (tools/ci/host_watch.py)
        mkdir -p graphics-out
        export VIRGL_LOG_LEVEL=debug VIRGL_LOG_FILE="$PWD/graphics-out/virglrenderer-%PID%.log"
        python3 tools/ci/host_watch.py graphics-out &
        trap 'kill $! 2>/dev/null || true' EXIT
        xvfb-run -a -s '-screen 0 1280x1024x24' \
          python3 tools/selftest.py --suite graphics --gfx gfx --img build/nova.img --out graphics-out \
          --junit graphics-out/junit.xml --summary "$GITHUB_STEP_SUMMARY"
    - name: Keep the serial log and screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: graphics-out
        path: graphics-out
        if-no-files-found: ignore
  ci-result:
    name: CI result
    needs:
    - checks
    - build
    - compatibility
    - boot-test
    - graphics-test
    - boot-result
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - name: Require every selected job
      run: python3 tools/ci/results.py ci
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
  publish-iso:
    name: Publish nova.iso
    needs:
    - ci-result
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-result.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-iso
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
    - name: Require current main before publication
      run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
    - uses: actions/download-artifact@v4
      with:
        name: nova-iso
    - uses: actions/download-artifact@v4
      with:
        name: venus
    - uses: actions/download-artifact@v4
      with:
        name: nova-boot
        path: boot
    - name: Make the update channel of this build
      env:
        NOVAOS_UPDATE_SIGNING_KEY: ${{ secrets.NOVAOS_UPDATE_SIGNING_KEY }}
      run: |
        sign=()
        if [ -n "$NOVAOS_UPDATE_SIGNING_KEY" ]; then
          sign=(--sign-env NOVAOS_UPDATE_SIGNING_KEY)
        else
          echo "::warning::no NOVAOS_UPDATE_SIGNING_KEY secret: the latest build's novaos-update.txt is unsigned (docs/releasing.md)"
        fi
        base=$(sed -n 's/^#define NOVA_VERSION "\(.*\)"$/\1/p' kernel/ke/version.h)
        dev="$base+dev.$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S "$GITHUB_SHA")"
        python3 tools/mkupdate.py channel --kernel boot/kernel.elf --loader boot/bootx64.efi --version "$dev" "${sign[@]}" \
          --notes "NovaOS $dev, a development build of main at ${GITHUB_SHA::7}: https://github.com/$GITHUB_REPOSITORY/releases/tag/latest"
        cat channel/novaos-update.txt
    - name: Move the "latest" release to this commit and attach the ISO
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
        sha256sum nova.iso > nova.iso.sha256
        git tag -f latest "$GITHUB_SHA"
        git push -f origin refs/tags/latest
        notes="NovaOS built from main at ${GITHUB_SHA::7} by CI run ${GITHUB_RUN_ID}.
        Boot it with UEFI firmware; see the README for the QEMU command line."
        mark=(--latest)
        if gh release list --exclude-pre-releases --exclude-drafts --limit 100 \
             --json tagName --jq '.[].tagName' | grep -q '^v[0-9]'; then
          mark=(--prerelease --latest=false)
          notes="$notes
        This is a development build; the newest tested release is
        https://github.com/dean-plude/os/releases/latest
        An installed NovaOS follows these builds with
        update channel https://github.com/dean-plude/os/releases/download/latest/novaos-update.txt"
        fi
        files=(nova.iso nova.iso.sha256 venus.7z channel/kernel.elf channel/bootx64.efi channel/novaos-update.txt)
        if gh release view latest >/dev/null 2>&1; then
          gh release upload latest "${files[@]}" --clobber
          gh release edit latest --title "NovaOS (latest main)" --notes "$notes" "${mark[@]}"
        else
          gh release create latest "${files[@]}" \
            --title "NovaOS (latest main)" --notes "$notes" "${mark[@]}"
        fi
    timeout-minutes: 15
  boot-result:
    name: Build and boot-test
    needs:
    - checks
    - build
    - boot-test
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - name: Require build and every OS suite
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: python3 tools/ci/results.py boot
